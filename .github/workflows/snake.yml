name: Snake

# Змейка, которая ест квадратики активности. Обновляется раз в день.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#cba6f7&color_dots=#313244,#45475a,#6c4bb4,#9b7bd8,#cba6f7
            dist/snake-dark.svg?palette=github-dark&color_snake=#cba6f7&color_dots=#1e1e2e,#45475a,#6c4bb4,#9b7bd8,#cba6f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
