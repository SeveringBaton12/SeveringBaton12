<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="frame"><rect width="900" height="360" rx="18"/></clipPath>
    <style>
      .b1{animation:d1 26s ease-in-out infinite alternate}
      .b2{animation:d2 32s ease-in-out infinite alternate}
      .b3{animation:d3 22s ease-in-out infinite alternate}
      .b4{animation:d4 36s ease-in-out infinite alternate}
      @keyframes d1{to{transform:translate(160px,60px)}}
      @keyframes d2{to{transform:translate(-180px,-40px)}}
      @keyframes d3{to{transform:translate(-90px,70px)}}
      @keyframes d4{to{transform:translate(120px,-60px)}}
      .w1{animation:f1 9s ease-in-out infinite alternate}
      .w2{animation:f2 11s ease-in-out infinite alternate}
      .w3{animation:f3 8s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(4px,-7px)}}
      @keyframes f2{to{transform:translate(-5px,6px)}}
      @keyframes f3{to{transform:translate(3px,5px)}}
      .focus{animation:pulse 4s ease-in-out infinite alternate}
      @keyframes pulse{from{opacity:.35}to{opacity:.9}}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq 1.6s ease-in-out infinite alternate}
      .eq rect:nth-child(2){animation-duration:1.1s}
      .eq rect:nth-child(3){animation-duration:1.9s}
      .eq rect:nth-child(4){animation-duration:1.3s}
      .eq rect:nth-child(5){animation-duration:1.7s}
      .eq rect:nth-child(6){animation-duration:1.2s}
      .eq rect:nth-child(7){animation-duration:2.1s}
      @keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
      .t{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-size:13px}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- обои: размытые пятна, как в desktop.glsl -->
    <rect width="900" height="360" fill="#191723"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="300" cy="90"  r="120" fill="#544070"/>
      <circle class="b2" cx="640" cy="250" r="110" fill="#5a2d45"/>
      <circle class="b3" cx="560" cy="80"  r="90"  fill="#3b6b57" opacity=".8"/>
      <circle class="b4" cx="130" cy="280" r="110" fill="#1f3346"/>
    </g>

    <!-- панель: плавающие плашки -->
    <g fill="#17111f" fill-opacity=".94" stroke="#fff" stroke-opacity=".09">
      <rect x="16"  y="12" width="54"  height="24" rx="12"/>
      <rect x="76"  y="12" width="78"  height="24" rx="12"/>
      <rect x="400" y="12" width="100" height="24" rx="12"/>
      <rect x="656" y="12" width="44"  height="24" rx="12"/>
      <rect x="706" y="12" width="44"  height="24" rx="12"/>
      <rect x="756" y="12" width="40"  height="24" rx="12"/>
      <rect x="802" y="12" width="56"  height="24" rx="12"/>
      <rect x="864" y="12" width="24"  height="24" rx="12"/>
    </g>
    <g fill="#e4d9f5" fill-opacity=".55">
      <rect x="30"  y="22" width="26" height="4" rx="2"/>
      <rect x="90"  y="22" width="50" height="4" rx="2"/>
      <rect x="422" y="21" width="56" height="6" rx="3" fill-opacity=".8"/>
      <rect x="668" y="22" width="20" height="4" rx="2"/>
      <rect x="718" y="22" width="20" height="4" rx="2"/>
      <rect x="768" y="22" width="16" height="4" rx="2"/>
      <rect x="814" y="22" width="32" height="4" rx="2" fill="#a6e3c4"/>
      <circle cx="876" cy="24" r="3"/>
    </g>

    <!-- окно 1: терминал (в фокусе) -->
    <g class="w1">
      <rect class="focus" x="60" y="70" width="400" height="230" rx="14" fill="none" stroke="#cba6f7" stroke-width="3" filter="url(#glow)"/>
      <g filter="url(#shadow)">
        <rect x="60" y="70" width="400" height="230" rx="14" fill="#130f1a" fill-opacity=".93" stroke="#cba6f7" stroke-opacity=".55"/>
      </g>
      <text class="t" x="82" y="102" fill="#cba6f7">~</text>
      <text class="t" x="98" y="102" fill="#e4d9f5" fill-opacity=".85">severingbaton</text>
      <g>
        <rect x="82"  y="118" width="70"  height="7" rx="3.5" fill="#cba6f7" fill-opacity=".8"/>
        <rect x="160" y="118" width="120" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".35"/>
        <rect x="82"  y="136" width="40"  height="7" rx="3.5" fill="#a6e3c4" fill-opacity=".7"/>
        <rect x="130" y="136" width="180" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".25"/>
        <rect x="82"  y="154" width="90"  height="7" rx="3.5" fill="#f5c2e7" fill-opacity=".6"/>
        <rect x="180" y="154" width="60"  height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".25"/>
        <rect x="100" y="172" width="150" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".2"/>
        <rect x="100" y="190" width="110" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".2"/>
        <rect x="82"  y="208" width="56"  height="7" rx="3.5" fill="#89b4fa" fill-opacity=".6"/>
        <rect x="146" y="208" width="200" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".25"/>
      </g>
      <text class="t" x="82" y="262" fill="#cba6f7">❯</text>
      <rect x="82" y="248" width="0" height="0"/>
      <rect x="100" y="252" width="56" height="7" rx="3.5" fill="#e4d9f5" fill-opacity=".5"/>
      <rect class="cur" x="162" y="249" width="8" height="14" rx="1.5" fill="#cba6f7"/>
    </g>

    <!-- окно 2: «fastfetch» -->
    <g class="w2">
      <g filter="url(#shadow)">
        <rect x="490" y="62" width="270" height="150" rx="14" fill="#130f1a" fill-opacity=".9" stroke="#fff" stroke-opacity=".1"/>
      </g>
      <path d="M548 92 L578 170 L560 162 L548 132 L536 162 L518 170 Z" fill="none" stroke="#cba6f7" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>
      <g>
        <rect x="600" y="96"  width="36"  height="6" rx="3" fill="#cba6f7" fill-opacity=".8"/>
        <rect x="642" y="96"  width="80"  height="6" rx="3" fill="#e4d9f5" fill-opacity=".3"/>
        <rect x="600" y="112" width="44"  height="6" rx="3" fill="#cba6f7" fill-opacity=".8"/>
        <rect x="650" y="112" width="62"  height="6" rx="3" fill="#e4d9f5" fill-opacity=".3"/>
        <rect x="600" y="128" width="30"  height="6" rx="3" fill="#cba6f7" fill-opacity=".8"/>
        <rect x="636" y="128" width="90"  height="6" rx="3" fill="#e4d9f5" fill-opacity=".3"/>
        <rect x="600" y="144" width="40"  height="6" rx="3" fill="#cba6f7" fill-opacity=".8"/>
        <rect x="646" y="144" width="54"  height="6" rx="3" fill="#e4d9f5" fill-opacity=".3"/>
      </g>
      <g>
        <rect x="600" y="170" width="14" height="14" rx="4" fill="#f38ba8"/>
        <rect x="618" y="170" width="14" height="14" rx="4" fill="#fab387"/>
        <rect x="636" y="170" width="14" height="14" rx="4" fill="#a6e3a1"/>
        <rect x="654" y="170" width="14" height="14" rx="4" fill="#89b4fa"/>
        <rect x="672" y="170" width="14" height="14" rx="4" fill="#cba6f7"/>
        <rect x="690" y="170" width="14" height="14" rx="4" fill="#f5c2e7"/>
      </g>
    </g>

    <!-- окно 3: микшер -->
    <g class="w3">
      <g filter="url(#shadow)">
        <rect x="560" y="236" width="230" height="96" rx="14" fill="#130f1a" fill-opacity=".9" stroke="#fff" stroke-opacity=".1"/>
      </g>
      <g class="eq" fill="#cba6f7" fill-opacity=".8">
        <rect x="586" y="262" width="12" height="48" rx="4"/>
        <rect x="610" y="262" width="12" height="48" rx="4" fill="#f5c2e7"/>
        <rect x="634" y="262" width="12" height="48" rx="4"/>
        <rect x="658" y="262" width="12" height="48" rx="4" fill="#a6e3c4"/>
        <rect x="682" y="262" width="12" height="48" rx="4"/>
        <rect x="706" y="262" width="12" height="48" rx="4" fill="#89b4fa"/>
        <rect x="730" y="262" width="12" height="48" rx="4"/>
      </g>
      <rect x="756" y="262" width="4" height="48" rx="2" fill="#e4d9f5" fill-opacity=".2"/>
      <circle cx="758" cy="276" r="6" fill="#e4d9f5" fill-opacity=".8"/>
    </g>
  </g>
  <rect width="899" height="359" x=".5" y=".5" rx="18" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
